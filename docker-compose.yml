services:
  postgres:
    image: postgres:17
    container_name: relatio_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - relatio_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: relatio_seq
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - relatio_seq_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: relatio_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - relatio_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.0
    container_name: relatio_keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./infra/keycloak/relatio-realm.json:/opt/keycloak/data/import/relatio-realm.json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  relatio-identity:
    build:
      context: .
      dockerfile: infra/docker/identity.Dockerfile
    container_name: relatio_identity
    ports:
      - "5212:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=relatio;
        Username=${DB_USER};Password=${DB_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Identity__AdminEmail: ${IDENTITY_ADMIN_EMAIL}
      Identity__AdminPassword: ${IDENTITY_ADMIN_PASSWORD}
      Identity__RunSeederOnStartup: "true"
      Consul__Url: http://consul:8500
      Seq__ServerUrl: http://seq:80
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      consul:
        condition: service_healthy
      seq:
        condition: service_healthy

  relatio-customers:
    build:
      context: .
      dockerfile: infra/docker/customers.Dockerfile
    container_name: relatio_customers
    ports:
      - "5211:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=relatio;
        Username=${DB_USER};Password=${DB_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Keycloak__Authority: http://keycloak:8080/realms/relatio
      Keycloak__Audience: relatio-api
      Consul__Url: http://consul:8500
      Seq__ServerUrl: http://seq:80
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      consul:
        condition: service_healthy
      seq:
        condition: service_healthy

  relatio-contacts:
    build:
      context: .
      dockerfile: infra/docker/contacts.Dockerfile
    container_name: relatio_contacts
    ports:
      - "5213:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=relatio;
        Username=${DB_USER};Password=${DB_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Keycloak__Authority: http://keycloak:8080/realms/relatio
      Keycloak__Audience: relatio-api
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__VirtualHost: /
      Consul__Url: http://consul:8500
      Seq__ServerUrl: http://seq:80
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      consul:
        condition: service_healthy
      seq:
        condition: service_healthy

  relatio-sales:
    build:
      context: .
      dockerfile: infra/docker/sales.Dockerfile
    container_name: relatio_sales
    ports:
      - "5215:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=relatio;
        Username=${DB_USER};Password=${DB_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Keycloak__Authority: http://keycloak:8080/realms/relatio
      Keycloak__Audience: relatio-api
      Keycloak__ServiceClientId: sales-service
      Keycloak__ServiceClientSecret: ${KEYCLOAK_SALES_CLIENT_SECRET}
      Services__CustomersBaseUrl: http://relatio-customers:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__VirtualHost: /
      Consul__Url: http://consul:8500
      Seq__ServerUrl: http://seq:80
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      consul:
        condition: service_healthy
      seq:
        condition: service_healthy
      relatio-customers:
        condition: service_started

  relatio-tasks:
    build:
      context: .
      dockerfile: infra/docker/tasks.Dockerfile
    container_name: relatio_tasks
    ports:
      - "5214:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=relatio;
        Username=${DB_USER};Password=${DB_PASSWORD}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Keycloak__Authority: http://keycloak:8080/realms/relatio
      Keycloak__Audience: relatio-api
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__VirtualHost: /
      Consul__Url: http://consul:8500
      Seq__ServerUrl: http://seq:80
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      consul:
        condition: service_healthy
      seq:
        condition: service_healthy

  consul:
    image: hashicorp/consul:1.19
    container_name: relatio_consul
    command: "agent -dev -client=0.0.0.0 -log-level=warn"
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: relatio_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      relatio-gateway:
        condition: service_started

  grafana:
    image: grafana/grafana:11.1.0
    container_name: relatio_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - relatio_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  relatio-gateway:
    build:
      context: .
      dockerfile: infra/docker/gateway.Dockerfile
    container_name: relatio_gateway
    ports:
      - "5200:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Consul__Url: http://consul:8500
      Seq__ServerUrl: http://seq:80
      Services__Identity: http://relatio-identity:8080
      Services__Customers: http://relatio-customers:8080
      Services__Contacts: http://relatio-contacts:8080
      Services__Sales: http://relatio-sales:8080
      Services__Tasks: http://relatio-tasks:8080
    depends_on:
      consul:
        condition: service_healthy
      seq:
        condition: service_healthy
      relatio-identity:
        condition: service_started
      relatio-customers:
        condition: service_started
      relatio-contacts:
        condition: service_started
      relatio-sales:
        condition: service_started
      relatio-tasks:
        condition: service_started

  relatio-ui:
    build:
      context: ./.ui
      dockerfile: Dockerfile
    container_name: relatio_ui
    ports:
      - "5173:5173"
    volumes:
      - ./.ui:/app
      - /app/node_modules
    environment:
      IDENTITY_URL: http://relatio-identity:8080
      CUSTOMERS_URL: http://relatio-customers:8080
      CONTACTS_URL: http://relatio-contacts:8080
      SALES_URL: http://relatio-sales:8080

volumes:
  relatio_postgres_data:
  relatio_seq_data:
  relatio_rabbitmq_data:
  relatio_grafana_data:
